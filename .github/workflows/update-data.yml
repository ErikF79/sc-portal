name: Update data

on:
  schedule:
    # 03:00 UTC ≈ 04:00 ora italiana (CET). GitHub usa orari UTC.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install engine dependencies
        run: pip install -r data_engine/requirements.txt

      # Cache dell'archivio osservazioni + cache LBA: rende i run robusti e incrementali.
      - name: Restore engine cache
        uses: actions/cache@v4
        with:
          path: |
            data_engine/observations
            data_engine/raw/lba_games_seen.json
          key: sc-portal-engine-v2-${{ github.run_id }}
          restore-keys: |
            sc-portal-engine-v2-

      - name: Seed observations cache from committed data
        run: |
          python - <<'PY'
          import json, os
          obs_path = "data_engine/observations/observations.json"
          existing = []
          if os.path.exists(obs_path):
              try:
                  with open(obs_path, encoding="utf-8") as fh:
                      existing = json.load(fh)
              except Exception:
                  existing = []
          try:
              with open("data_engine/output/sc_portal_data.json", encoding="utf-8") as fh:
                  committed = json.load(fh).get("matches", [])
          except Exception:
              committed = []
          merged = {o["observation_id"]: o for o in existing if o.get("observation_id")}
          for m in committed:
              oid = m.get("observation_id")
              if not oid:
                  continue
              merged.setdefault(oid, {k: v for k, v in m.items()
                                       if k not in ("match_id", "verification_status")})
          os.makedirs(os.path.dirname(obs_path), exist_ok=True)
          with open(obs_path, "w", encoding="utf-8") as fh:
              json.dump(sorted(merged.values(), key=lambda x: (x.get("date") or "", x.get("time") or "", x.get("home") or "")),
                        fh, ensure_ascii=False, indent=2, sort_keys=True)
          print(f"observations ready: {len(merged)}")
          PY

      - name: Run data engine
        run: python data_engine/sc_data_engine.py

      - name: Diagnostics
        run: |
          python - <<'PY'
          import json
          try:
              d = json.load(open("data_engine/output/sc_portal_data.json", encoding="utf-8"))
          except Exception as e:
              print("cannot read output:", e); raise SystemExit(0)
          print("summary:", json.dumps(d.get("sync_summary"), ensure_ascii=False))
          for err in (d.get("errors") or [])[:8]:
              print("ERR:", json.dumps(err, ensure_ascii=False))
          PY
          echo "--- connectivity probe ---"
          curl -sS -o /dev/null -w "fip.it -> %{http_code}\n" "https://fip.it/risultati/" || true
          curl -sS -o /dev/null -w "playbasket -> %{http_code}\n" "https://www.playbasket.it/" || true
          curl -sS -o /dev/null -w "api-sdp -> %{http_code}\n" "https://api-sdp.legaseriea.it/" || true

      - name: Safety check (do not publish degraded data)
        run: |
          python - <<'PY'
          import json, subprocess, sys
          def load(p):
              try:
                  with open(p, encoding="utf-8") as fh:
                      return json.load(fh)
              except Exception:
                  return None
          old = None
          try:
              old = json.loads(subprocess.check_output(
                  ["git", "show", "HEAD:data_engine/output/sc_portal_data.json"]).decode("utf-8"))
          except Exception:
              old = None
          new = load("data_engine/output/sc_portal_data.json")
          if not new:
              print("No output produced"); sys.exit(1)
          n_new = len(new.get("matches", []))
          n_old = len(old.get("matches", [])) if old else 0
          print(f"matches: old={n_old} new={n_new}")
          if old and n_new < n_old:
              print("Refusing to publish fewer matches than already committed.")
              sys.exit(1)
          PY

      - name: Commit and push if changed
        run: |
          git config user.name "sc-portal-bot"
          git config user.email "sc-portal-bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain data_engine/output/sc_portal_data.json)" ]; then
            git add data_engine/output/sc_portal_data.json
            git commit -m "data: auto-update $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          else
            echo "No data change"
          fi
